<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MotoRepuestos</h1>
        <nav>
            <a href="#inicio">Inicio</a>

    <section id="inicio">

        <div class="tarjeta">

        <div class="tarjeta">
            <img src="llanta.png" alt="Llanta">
